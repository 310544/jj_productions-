<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JJ Production" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>JJ Production · Alquiler de Trajes</title>
    <!-- Fuente cargada SIN bloquear el render: el navegador pinta la app de
         inmediato (con una fuente del sistema) y cambia a Plus Jakarta Sans
         cuando termina de bajar. Evita la pantalla en blanco esperando a Google. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <style>
      /* Loader instantáneo: se ve apenas abre la app, antes de que cargue el
         JavaScript. Evita la pantalla en blanco. React lo reemplaza al montar. */
      html, body { margin: 0; background: #EFEBE4; }
      #app-loader {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: #EFEBE4;
      }
      #app-loader .spinner {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.12);
        border-top-color: #b8923f;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
