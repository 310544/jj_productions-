<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2317"/>
      <stop offset="0.55" stop-color="#1A150D"/>
      <stop offset="1" stop-color="#0E0B06"/>
    </linearGradient>
    <linearGradient id="gold" x1="120" y1="120" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6E27A"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9A7B2E"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="0.5" stop-color="#F6E27A"/>
      <stop offset="1" stop-color="#A8823A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Marco interior dorado fino -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldSoft)" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Moño / corbatín -->
  <g filter="url(#shadow)">
    <!-- ala izquierda -->
    <path d="M243 196 L150 158 C138 153 124 162 124 175 L124 305 C124 318 138 327 150 322 L243 284 Z" fill="url(#gold)"/>
    <!-- ala derecha -->
    <path d="M269 196 L362 158 C374 153 388 162 388 175 L388 305 C388 318 374 327 362 322 L269 284 Z" fill="url(#gold)"/>
    <!-- nudo central -->
    <rect x="236" y="206" width="40" height="68" rx="14" fill="url(#gold)"/>
    <!-- brillo del nudo -->
    <rect x="244" y="214" width="10" height="52" rx="5" fill="#FFF4C9" fill-opacity="0.5"/>
    <!-- pliegues sutiles -->
    <path d="M150 178 L150 302" stroke="#7A5E22" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
    <path d="M362 178 L362 302" stroke="#7A5E22" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Monograma -->
  <text x="256" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="4" fill="url(#goldSoft)">JJ</text>
  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.62">PRODUCTION</text>
</svg>
