<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2317"/>
      <stop offset="0.55" stop-color="#1A150D"/>
      <stop offset="1" stop-color="#0E0B06"/>
    </linearGradient>
    <linearGradient id="gold" x1="120" y1="120" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6E27A"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
